name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13 --frozen
      - run: uv run --python 3.13 ruff check .
      - run: uv run --python 3.13 pytest
      - run: uv build --python 3.13
      - run: uv run --python 3.13 python scripts/check_distribution.py
