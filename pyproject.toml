[project]
name = "arch-upload"
version = "0.1.0"
description = "Small resumable file uploader driven by a temporary upload session"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tuspy==1.1.0"]
license = "LicenseRef-Proprietary"
license-files = ["NOTICE"]

[project.urls]
Source = "https://github.com/the-simulation-company/arch-upload"

[project.scripts]
arch-upload = "arch_upload.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<0.13", "build>=1,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arch_upload"]

[tool.hatch.build.targets.sdist]
include = ["src/arch_upload", "pyproject.toml", "README.md", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
